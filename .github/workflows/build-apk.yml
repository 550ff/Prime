
name: PRIME LAUNCHER - Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - o-mr1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 27
        run: |
          sdkmanager "platforms;android-27" "build-tools;27.0.3"

      - name: Switch to JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'
          cache-disabled: true
          validate-wrappers: false

      - name: Prepare PRIME source for debug build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          companion = Path("companion/smartspace/build.gradle")
          java = Path("src/com/hdeva/launcher/LeanUtils.java")

          for p in (root, companion, java):
              if not p.is_file():
                  raise SystemExit("Required file missing: " + str(p))

          def remove_block(source, name):
              match = re.search(
                  r'(?m)^[ \t]*' + re.escape(name) + r'\s*\{',
                  source
              )
              if not match:
                  raise SystemExit("Missing " + name + " block")

              brace = source.find("{", match.start())
              depth = 0
              end = None

              for i in range(brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Unclosed " + name + " block")

              return source[:match.start()] + source[end:]

          # Prepare root Android project.
          s = root.read_text()

          s, count = re.subn(
              r"(aosp\s*\{\s*applicationId\s*)'[^']+'",
              r"\1'com.prime.launcher'",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not set AOSP application ID")

          s = remove_block(s, "signingConfigs")
          s = re.sub(
              r'(?m)^[ \t]*signingConfig\s+signingConfigs\.lean\s*\n',
              '',
              s
          )

          s = re.sub(
              r'(?m)^[ \t]*classpath\s+[\'"]com\.google\.gms:google-services:[^\'"]+[\'"]\s*\n',
              '',
              s
          )
          s = s.replace(
              "apply plugin: 'com.google.gms.google-services'",
              ""
          )

          s = re.sub(
              r'(?m)^[ \t]*implementation\s+[\'"]com\.google\.firebase:firebase-(?:core|crash):[^\'"]+[\'"]\s*\n',
              '',
              s
          )

          if "LEAN_RELEASE_KEY_" in s or "signingConfigs.lean" in s:
              raise SystemExit("Root private signing references remain")

          if "firebase-crash" in s or "google-services" in s:
              raise SystemExit("Root Firebase build configuration remains")

          root.write_text(s)

          # Prepare companion project.
          s = companion.read_text()
          s = remove_block(s, "signingConfigs")
          s = re.sub(
              r'(?m)^[ \t]*signingConfig\s+signingConfigs\.lean\s*\n',
              '',
              s
          )

          if "LEAN_RELEASE_KEY_" in s or "signingConfigs.lean" in s:
              raise SystemExit("Companion private signing references remain")

          companion.write_text(s)

          # Remove obsolete Firebase Crash source references.
          s = java.read_text()

          s, count = re.subn(
              r'(?m)^import com\.google\.firebase\.crash\.FirebaseCrash;\s*\n',
              '',
              s
          )
          if count != 1:
              raise SystemExit("FirebaseCrash import was not found exactly once")

          s, count = re.subn(
              r'FirebaseCrash\.report\(throwable\);',
              'Log.e("Crashreporting", "Non-fatal exception", throwable);',
              s
          )
          if count != 1:
              raise SystemExit("FirebaseCrash report call was not found exactly once")

          if "FirebaseCrash" in s:
              raise SystemExit("FirebaseCrash reference still remains")

          java.write_text(s)

          print("Root project prepared.")
          print("Companion project prepared.")
          print("Firebase Crash source reference replaced with Android logging.")
          print("AOSP application ID: com.prime.launcher")
          print("All preparation checks passed.")
          PY

      - name: Build PRIME AOSP debug APK
        run: gradle assembleAospDebug --stacktrace

      - name: Upload PRIME APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-LAUNCHER-DEBUG-APK
          path: build/outputs/apk/aosp/debug/*.apk
          if-no-files-found: error
