
name: PRIME LAUNCHER - Phase 1 Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - o-mr1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 27
        run: |
          sdkmanager "platforms;android-27" "build-tools;27.0.3"

      - name: Switch to JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'
          cache-disabled: true
          validate-wrappers: false

      - name: Prepare and verify both Android projects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("build.gradle"),
              Path("companion/smartspace/build.gradle")
          ]

          def remove_block(source, keyword):
              start = source.find(keyword)
              if start < 0:
                  raise SystemExit("Missing block: " + keyword)

              brace = source.find("{", start)
              depth = 0
              end = -1

              for i in range(brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end < 0:
                  raise SystemExit("Unclosed block: " + keyword)

              return source[:start] + source[end:]

          for p in files:
              s = p.read_text()

              if p == files[0]:
                  s, count = re.subn(
                      r"(aosp\s*\{\s*applicationId\s*)'[^']+'",
                      r"\1'com.prime.launcher'",
                      s,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit("AOSP applicationId not found")

                  s = s.replace(
                      "mavenCentral()\n        jcenter()\n        google()",
                      "google()\n        mavenCentral()\n        jcenter()"
                  )

                  s = s.replace(
                      "apply plugin: 'com.google.gms.google-services'",
                      ""
                  )

                  s = re.sub(
                      r'^\s*implementation "com\.google\.firebase:firebase-(core|crash):\$gms_version"\s*$',
                      "",
                      s,
                      flags=re.M
                  )

              s = remove_block(s, "signingConfigs")
              s = re.sub(
                  r'^\s*signingConfig\s+signingConfigs\.lean\s*$',
                  "",
                  s,
                  flags=re.M
              )

              if "LEAN_RELEASE_KEY_" in s or "signingConfigs.lean" in s:
                  raise SystemExit(
                      "Private signing reference remains in " + str(p)
                  )

              p.write_text(s)
              print("Verified:", p)

          print("Both projects are prepared.")
          PY

      - name: Build PRIME AOSP debug APK
        run: gradle assembleAospDebug --stacktrace

      - name: Upload PRIME APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-LAUNCHER-Phase1-Baseline
          path: build/outputs/apk/aosp/debug/*.apk
          if-no-files-found: error
