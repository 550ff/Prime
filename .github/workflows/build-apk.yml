
name: PRIME LAUNCHER - Phase 1 Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - o-mr1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 27
        run: |
          sdkmanager "platforms;android-27" "build-tools;27.0.3"

      - name: Switch to JDK 8 for legacy Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'
          cache-disabled: true
          validate-wrappers: false

      - name: Prepare PRIME baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")
          s = p.read_text()

          s = s.replace(
              "mavenCentral()\n        jcenter()\n        google()",
              "google()\n        mavenCentral()\n        jcenter()"
          )

          s, count = re.subn(
              r"(aosp\s*\{\s*applicationId\s*)'[^']+'",
              r"\1'com.prime.launcher'",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("AOSP applicationId was not found")

          s, count = re.subn(
              r"    signingConfigs\s*\{\s*lean\s*\{.*?\n        \}\s*\}\s*",
              "",
              s,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit("Legacy signing configuration was not found")

          s = s.replace(
              "            signingConfig signingConfigs.lean\n",
              ""
          )

          s = s.replace(
              "apply plugin: 'com.google.gms.google-services'",
              ""
          )

          s = re.sub(
              r'^\s*implementation "com\.google\.firebase:firebase-(core|crash):\$gms_version"\s*$',
              "",
              s,
              flags=re.M
          )

          p.write_text(s)
          PY

      - name: Build PRIME AOSP debug APK
        run: gradle assembleAospDebug --stacktrace

      - name: Upload PRIME APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-LAUNCHER-Phase1-Baseline
          path: build/outputs/apk/aosp/debug/*.apk
          if-no-files-found: error
